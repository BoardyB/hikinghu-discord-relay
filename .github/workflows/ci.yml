name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 'devvit-app'
    strategy:
      matrix:
        node-version: [ 24.x ]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run build
